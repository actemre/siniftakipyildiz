name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Web Directory & Install Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android sharp
          npx cap init "Sınıf Cepte" "com.sinifcepte.app" --web-dir www
          npx cap add android

      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.capabilitiesResolution.withCapability("org.jetbrains.kotlin:kotlin-stdlib") {
                  selectHighestVersion()
              }
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                  }
              }
          }
          dependencies {
              modules {
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "Use single kotlin-stdlib")
                  }
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "Use single kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Generate and Override App Icons
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");

          const possiblePaths = [
            "resources/icon.png",
            "resources/icon.PNG",
            "icon.png",
            "icon.PNG"
          ];

          let iconPath = possiblePaths.find(p => fs.existsSync(p));

          if (!iconPath) {
            console.error("HATA: İkon dosyası bulunamadı! Lütfen resources/icon.png yüklendiğinden emin olun.");
            process.exit(1);
          }

          console.log("Kullanılan ikon:", iconPath);

          const resDir = path.join("android", "app", "src", "main", "res");
          const sizes = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192
          };

          async function processIcons() {
            for (const [folder, size] of Object.entries(sizes)) {
              const targetFolder = path.join(resDir, folder);
              if (fs.existsSync(targetFolder)) {
                await sharp(iconPath).resize(size, size).toFile(path.join(targetFolder, "ic_launcher.png"));
                await sharp(iconPath).resize(size, size).toFile(path.join(targetFolder, "ic_launcher_round.png"));
                await sharp(iconPath).resize(size, size).toFile(path.join(targetFolder, "ic_launcher_foreground.png"));
              }
            }
            console.log("Tüm Android ikonları başarıyla yenilendi!");
          }

          processIcons().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK & Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB (Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-AAB
          path: android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: warn
