name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java Kur (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Web Uygulamasını Android Projesine Dönüştür
        run: |
          mkdir -p build-dir/www
          cp index.html build-dir/www/
          cd build-dir
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "YildizTakip" "com.yildiztakip.app" --web-dir www
          npx cap add android

          # 1. Kök build.gradle seviyesinde tüm modüllere Kotlin exclude kuralı tanımla
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          # 2. Bellek yetersizliği (OOM) ve çökmesini engellemek için JVM ayarlarını optimize et
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: APK ve AAB Paketlerini Derle
        run: |
          cd build-dir/android
          chmod +x gradlew
          
          # Android SDK lisanslarını otomatik kabul et
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Paketleri derle
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleDebug --no-daemon

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: YildizTakip-APK
          path: build-dir/android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: YildizTakip-AAB
          path: build-dir/android/app/build/outputs/bundle/debug/app-debug.aab
