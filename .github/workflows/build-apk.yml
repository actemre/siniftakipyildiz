name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Web Directory & Install Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sınıf Cepte" "com.sinifcepte.app" --web-dir www
          npx cap add android

      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.capabilitiesResolution.withCapability("org.jetbrains.kotlin:kotlin-stdlib") {
                  selectHighestVersion()
              }
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                  }
              }
          }
          dependencies {
              modules {
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "Use single kotlin-stdlib")
                  }
                  module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") {
                      replacedBy("org.jetbrains.kotlin:kotlin-stdlib", "Use single kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: Prepare & Generate App Icons
        run: |
          SRC_ICON=""
          if [ -f resources/icon.png ]; then SRC_ICON="resources/icon.png"; fi
          if [ -f resources/icon.PNG ]; then SRC_ICON="resources/icon.PNG"; fi
          if [ -f icon.png ]; then SRC_ICON="icon.png"; fi

          if [ -n "$SRC_ICON" ]; then
            echo "İkon bulundu: $SRC_ICON"
            convert "$SRC_ICON" -resize 1024x1024! /tmp/icon1024.png
            # Android mipmap klasörlerine doğrudan kopyala
            for dir in android/app/src/main/res/mipmap-*; do
              convert /tmp/icon1024.png -resize 192x192 "$dir/ic_launcher.png" 2>/dev/null || true
              convert /tmp/icon1024.png -resize 192x192 "$dir/ic_launcher_round.png" 2>/dev/null || true
              convert /tmp/icon1024.png -resize 192x192 "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK & Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB (Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-AAB
          path: android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: warn
