name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java Kur (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Hazirla
        uses: android-actions/setup-android@v3

      - name: Web Uygulamasını Android Projesine Dönüştür
        run: |
          mkdir build-dir
          cp index.html build-dir/
          cd build-dir
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "YildizTakip" "com.yildiztakip.app" --web-dir .
          npx cap add android
          npx cap sync android

      - name: APK ve AAB Paketlerini Derle
        run: |
          cd build-dir/android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: YildizTakip-APK
          path: build-dir/android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: YildizTakip-AAB
          path: build-dir/android/app/build/outputs/bundle/debug/app-debug.aab
