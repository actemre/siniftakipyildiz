name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Web Directory & Install Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/text-to-speech
          npx cap init "Sınıf Cepte" "com.sinifcepte.app" --web-dir www
          npx cap add android

      - name: Prepare & Generate App Icons
        run: |
          mkdir -p assets
          SRC_ICON=""
          if [ -f resources/icon.png ]; then SRC_ICON="resources/icon.png"; fi
          if [ -f resources/icon.PNG ]; then SRC_ICON="resources/icon.PNG"; fi
          if [ -f icon.png ]; then SRC_ICON="icon.png"; fi
          if [ -f icon.PNG ]; then SRC_ICON="icon.PNG"; fi

          if [ -n "$SRC_ICON" ]; then
            echo "İkon dosyası bulundu: $SRC_ICON"
            convert "$SRC_ICON" -resize 1024x1024! assets/logo.png || cp "$SRC_ICON" assets/logo.png
            cp assets/logo.png assets/icon-only.png
            cp assets/logo.png assets/icon-foreground.png
            convert -size 1024x1024 xc:white assets/icon-background.png || true
            npx @capacitor/assets generate --android --iconOnly || true
          else
            echo "Özel ikon bulunamadı, varsayılan simgeler kullanılıyor."
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK & Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB (Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-AAB
          path: android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: warn
