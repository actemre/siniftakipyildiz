name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Java (JDK 17) Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v3

      - name: Capacitor Projesini Hazirla
        run: |
          mkdir app-build && cd app-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BenimUygulamam" "com.benimuygulamam.app" --web-dir ../
          npx cap add android
          npx cap sync android

      - name: APK ve AAB Derle
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: APK Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Uygulama-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Uygulama-AAB
          path: app-build/android/app/build/outputs/bundle/debug/app-debug.aab
