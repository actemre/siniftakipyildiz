name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Web Directory & Install Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/text-to-speech
          npx cap init "Sınıf Cepte" "com.sinifcepte.app" --web-dir www
          npx cap add android

      - name: Generate App Icons
        run: |
          npm install -g @capacitor/assets
          npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK & Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
