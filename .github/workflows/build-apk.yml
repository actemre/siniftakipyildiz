name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java Kur (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Web Uygulamasını Android Projesine Dönüştür
        run: |
          mkdir -p build-dir/www
          cp index.html build-dir/www/
          cd build-dir
          npm init -y
          # Yerel Android Text-To-Speech eklentisini kuruyoruz:
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/text-to-speech
          npx cap init "Sınıf Cepte" "com.sinifcepte.app" --web-dir www
          npx cap add android

          # Kütüphane çakışmalarını engelleyen ayarlar:
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          echo "
          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      }
                  }
              }
          }
          " >> android/build.gradle

          npx cap sync android

      - name: APK ve AAB Paketlerini Derle
        run: |
          cd build-dir/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleDebug --no-daemon

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: SinifCepte-APK
          path: build-dir/android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: YildizTakip-AAB
          path: build-dir/android/app/build/outputs/bundle/debug/app-debug.aab
